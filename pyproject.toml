[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fraudshield"
version = "1.0.0"
description = "FraudShield AI: real-time fraud scoring, decisioning, investigation and monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Armand Junior Dongmo Notue" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Training needs PyTorch (autoencoder) and matplotlib (report figures). Serving does not:
# the autoencoder forward pass is exported to NumPy, keeping the API image small.
train = ["torch>=2.2", "matplotlib>=3.8"]
tracking = ["mlflow-skinny>=2.12"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
fraudshield = "fraudshield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudshield", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: exercises the API end to end against a model trained on synthetic data",
  "performance: latency/throughput checks (skipped unless FRAUDSHIELD_RUN_PERF=1)",
]
filterwarnings = ["ignore::DeprecationWarning:xgboost.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks", "dashboard", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/reproduce_legacy.py" = ["E701", "E702", "B023", "SIM108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/fraudshield", "api"]
