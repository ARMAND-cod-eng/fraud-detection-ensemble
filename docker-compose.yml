# Local stack. Train first (once) so ./artifacts contains a promoted model:
#   docker compose --profile train run --rm trainer      # or: fraudshield download-data && fraudshield train --promote
#   docker compose up -d api                              # dashboard + API on http://localhost:8000
#   docker compose --profile monitoring up -d            # + Prometheus :9090 and Grafana :3000
services:
  api:
    build: { context: ., target: runtime }
    image: fraudshield-api:local
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./artifacts:/app/artifacts:ro
      - fraudshield-var:/app/var
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  trainer:
    profiles: ["train"]
    build: { context: ., target: trainer }
    image: fraudshield-trainer:local
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./benchmarks/results:/app/benchmarks/results

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  fraudshield-var: {}
