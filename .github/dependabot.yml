# Weekly dependency update PRs. Pinned versions mean upgrades arrive as reviewable PRs that must
# pass CI (tests, coverage, pip-audit, npm audit, image build) before merging.
#
# The serving image must run the same Python / numpy / scikit-learn / xgboost versions that trained
# the model artifact (the Isolation Forest is a pickle). Upgrading those is a retrain-and-promote
# decision, not a routine bump, so only patch updates are proposed for them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "xgboost*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Python must match the training environment (see above).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Stay on Node LTS lines; odd-numbered majors are not LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
