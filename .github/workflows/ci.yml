name: CI

on:
  push:
    branches: [main, fraudshield-upgrade]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, type-check and test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests with coverage (unit + integration; model trained on synthetic data, no dataset needed)
        run: pytest -q --durations=10 --cov=src/fraudshield --cov=api --cov-report=term --cov-fail-under=88
      - name: Dependency vulnerability audit (runtime image dependencies)
        run: pip-audit -r requirements/serve.txt --progress-spinner off

  dashboard:
    name: Dashboard type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - run: npm run build

  docker:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [python, dashboard]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: fraudshield-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
